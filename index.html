<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>procedi-app</title>
  </head>
  <body translate="no" class="notranslate">
    <div id="root" translate="no" class="notranslate"></div>
    <!-- Pilha de toasts fora de #root: evita overflow/transform cortarem ou empilharem errado -->
    <div
      id="procedi-toast-root"
      translate="no"
      class="notranslate"
      aria-label="Notificações"
      style="
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 2147483647;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        padding: 1rem;
        padding-top: max(1rem, env(safe-area-inset-top, 0px));
      "
    ></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
